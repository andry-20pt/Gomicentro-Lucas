<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOMICENTRO LUCAS</title>
<style>
:root{--bg:#F4F4F5;--pri:#C81D25;--ink:#18181B;--mut:#71717A;--bd:#D4D4D8;--sel:#FBE1E1;--warn:#FDE68A;--dng:#FCA5A5;--cre:#DBEAFE;--abo:#DCFCE7}
*{box-sizing:border-box}body{margin:0;font:14px 'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
#app{display:flex;height:100vh}#side{width:230px;background:#fff;border-top:4px solid var(--pri);display:flex;flex-direction:column;overflow:auto;flex-shrink:0}
.logo{text-align:center;padding:24px 0 14px;border-bottom:1px solid var(--bd);margin:0 24px 8px}.logo b{font-size:24px;display:block}.logo small{color:var(--pri);font-weight:700;letter-spacing:3px;font-size:9px}

tr.r{cursor:pointer}tr.r:hover td{background:#fafafa}tr.sel td{background:var(--sel)!important;color:var(--pri)}tr.warn td{background:var(--warn)}tr.dng td{background:var(--dng)}tr.cre td{background:var(--cre)}tr.abo td{background:var(--abo)}

#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:9}#modal.on{display:flex}#mb{background:var(--bg);border-top:4px solid var(--pri);padding:20px;max-width:760px;width:94%;max-height:92vh;overflow:auto}

.row{display:flex;gap:8px}.row>*{flex:1}.err{color:#E11D2E;font-weight:700}.ok{color:#15803d;font-weight:700}
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:20}#login .card{width:330px;padding:32px;border-top:5px solid var(--pri)}
@media print{#app,#login{display:none!important}#modal{position:static;background:none;display:block}#mb{border:0;padding:0}#mb button,.noprint{display:none!important}pre{border:0}}
@media(max-width:800px){#app{flex-direction:column;height:auto}#side{width:auto;flex-direction:row;flex-wrap:wrap}.split{flex-direction:column}.side{width:100%}}
</style></head><body>
<div id="login"><div class="card"><div style="text-align:center;margin-bottom:18px"><b style="font-size:26px;display:block">LUCAS</b><small style="color:var(--pri);font-weight:700;letter-spacing:4px">GOMICENTRO</small></div>
<label>Usuario</label><input id="lu" value="admin"><label>Contraseña</label><input id="lp" type="password"><p id="le" class="err"></p><button class="b1 w" onclick="entrar()">ENTRAR</button></div></div>
<div id="app"><div id="side"></div><div id="main"></div></div><div id="modal"><div id="mb"></div></div>
<script>
const $=s=>document.querySelector(s),M=n=>'$'+(+n||0).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2}),
loc=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4),hoy=()=>loc().toISOString().slice(0,10),hora=()=>new Date().toTimeString().slice(0,5),
ayer=()=>new Date(loc()-864e5).toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='gomicentro_lucas_v1';let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S)S={seq:100,productos:[{id:1,nombre:'Goma 225-70-16',cant:8,pc:2400,pv:3200,min:3},{id:2,nombre:'Goma usada 195-65-15',cant:2,pc:600,pv:1000,min:3},{id:3,nombre:'Tubo 17',cant:0,pc:250,pv:450,min:2},{id:4,nombre:'Aceite 20W-50',cant:12,pc:300,pv:480,min:4}],servicios:[{id:5,nombre:'Reparación de goma',precio:150},{id:6,nombre:'Cambio de goma',precio:200}],gomeros:['Pedro','Juan'],clientes:[],cargos:[],abonos:[],ventas:[],facturas:[],entradas:[],usuarios:[{id:1,u:'admin',p:'202404',rol:'admin',act:1}],cfg:{imp:1}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},nid=()=>++S.seq;
let ses,cur,cart=[],selT={},tab='P',q='',catF='Todos',estF='Todos';
const ES=a=>a==='admin';
const NAV=[['🏠','Inicio','dash'],['🛒','Punto de Venta','vta'],['📦','Productos','prod'],['⚠️','Stock Bajo','stk'],['📥','Entrada Mercancía','ent'],['🛠️','Servicios','serv'],['👨‍🔧','Gomeros','gom'],['💳','Créditos','cred'],['📊','Historial','his'],['🔎','Buscar Factura','fac'],['📋','Reporte Gomeros','rep'],['👥','Usuarios','usr']];
const CAJ=['vta','cred','his','stk','fac'];
function entrar(){const u=S.usuarios.find(x=>x.u.toLowerCase()==$('#lu').value.trim().toLowerCase()&&x.p==$('#lp').value&&x.act);
 if(!u){$('#le').textContent='Usuario o contraseña incorrectos.';return}ses=u;$('#login').style.display='none';$('#lp').value='';$('#le').textContent='';
 $('#side').innerHTML=`<div class="logo"><b>LUCAS</b><small>GOMICENTRO</small></div>`+NAV.filter(n=>ES(u.rol)||CAJ.includes(n[2])).map(n=>`<div class="nav" id="n_${n[2]}" onclick="go('${n[2]}')">${n[0]}&nbsp; ${n[1]}</div>`).join('')+`<div class="foot"><b>👤 ${esc(u.u)}</b><small>${ES(u.rol)?'Administrador':'Cajero'}</small><button class="w" onclick="if(confirm('¿Cerrar la sesión actual?')){cart=[];$('#login').style.display='flex'}">⎋ Cerrar sesión</button></div>`;
 go(ES(u.rol)?'dash':'vta')}
$('#lp').addEventListener('keydown',e=>e.key=='Enter'&&entrar());
const head=(t,s)=>`<h1>${t}</h1><div class="sub">${s||''}</div>`;
function go(k){cur=k;q='';document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.id=='n_'+k));selT={};R[k]();}
const rr=()=>R[cur](),main=h=>$('#main').innerHTML=h;
function openM(h){$('#mb').innerHTML=h;$('#modal').classList.add('on')}function closeM(){$('#modal').classList.remove('on')}
const sel=(t,id)=>{selT[t]=id;rr()};
// ---------- lógica ----------
const deuda=c=>S.cargos.filter(x=>x.cid==c).reduce((a,x)=>a+x.total,0)-S.abonos.filter(x=>x.cid==c).reduce((a,x)=>a+x.monto,0);
function estados(c){let r=S.abonos.filter(x=>x.cid==c).reduce((a,x)=>a+x.monto,0);return S.cargos.filter(x=>x.cid==c).sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:a.id-b.id).map(x=>{let ab=r<=0?0:r>=x.total?x.total:r;r-=ab;return{...x,ab,est:ab<=0?'Pendiente':ab>=x.total?'Pagado':'Parcial'}})}
function atraso(c){const cl=S.clientes.find(x=>x.id==c);if(!cl||!cl.plazo)return 0;const p=estados(c).find(x=>x.est!='Pagado');if(!p)return 0;return Math.max(Math.floor((new Date(hoy())-new Date(p.fecha))/864e5)-cl.plazo,0)}
const CATS=[['Tubos / Cámaras',/tubo|camara|\btube\b/],['Lubricantes',/aceite|lubric|grasa|valvulina|\batf\b|\boil\b|\bsae\b|\d{1,2}w-?\d{2}/],['Gomas',/goma|llanta|neumatic|caucho|\d{2,3}\/\d{2,3}|\d\.\d{2}-\d{2}/]];
function cat(n){const t=n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/sin\s+tubo|tubeless/g,' ');for(const[c,r]of CATS)if(r.test(t))return c;return 'Otros'}
const tcls=p=>p.cant<=0?'dng':p.cant<=p.min?'warn':'';
const pedirClave=m=>{const c=prompt(m+'\n\nClave de administrador:');return c!==null&&S.usuarios.some(u=>u.rol=='admin'&&u.act&&u.p==c)||(c!==null&&alert('Clave incorrecta.'),false)};
// ---------- tickets ----------
const W=32,lr=(a,b)=>(String(a).slice(0,W-String(b).length-1)).padEnd(W-String(b).length)+b,ctr=s=>' '.repeat(Math.max(0,(W-s.length)>>1))+s,fl=i=>i?i.split('-').reverse().join('/'):'',
wrap=(s,n)=>{const o=[];s=String(s);for(let i=0;i<s.length;i+=n)o.push(s.slice(i,i+n));return o.length?o:['']};
const cab=(t,c,f,h)=>['='.repeat(W),ctr('GOMICENTRO LUCAS'),ctr('Taller y Venta de Gomas'),'='.repeat(W),ctr(t),lr('No.:',c),lr('Fecha:',fl(f)),lr('Hora:',h||'-')];
function tkFactura(f){const its=[...S.ventas.filter(v=>v.fid==f.id).map(v=>[v.nombre,v.cant,v.total]),...S.cargos.filter(v=>v.fid==f.id).map(v=>[v.desc,v.cant,v.total])],cr=f.tipo=='CREDITO';
 let L=cab(cr?'FACTURA A CREDITO':'FACTURA AL CONTADO',f.cod,f.fecha,f.hora);if(f.cnom)L.push('Cliente: '+f.cnom);if(f.gomero&&f.gomero!='-')L.push('Gomero: '+f.gomero);if(f.cajero)L.push('Cajero: '+f.cajero);
 L.push('-'.repeat(W),'Item'.padEnd(11)+'Cnt'.padStart(3)+'P.U'.padStart(9)+'Tot'.padStart(9));let t=0;
 its.forEach(([n,c,x])=>{t+=x;const p=wrap(n,11);L.push(p[0].padEnd(11)+String(c).padStart(3)+(x/c).toFixed(2).padStart(9)+x.toFixed(2).padStart(9));p.slice(1).forEach(y=>L.push(y))});
 L.push('-'.repeat(W),lr('TOTAL:',t.toLocaleString('en',{minimumFractionDigits:2})),'='.repeat(W));if(cr)L.push(ctr('VENTA A CREDITO - PENDIENTE'));L.push(ctr('Guarde este codigo para'),ctr('consultar su factura:'),ctr(f.cod));return L}
function tkAbono(a){const c=S.clientes.find(x=>x.id==a.cid),n=x=>x.toLocaleString('en',{minimumFractionDigits:2});let L=cab('RECIBO DE ABONO',a.cod,a.fecha,a.hora);L.push('Cliente: '+(c?c.nombre:''));if(a.cajero)L.push('Recibio: '+a.cajero);
 L.push('-'.repeat(W),lr('Deuda anterior:',n(a.ant)),lr('Abono recibido:',n(a.monto)),'-'.repeat(W),lr('RESTA:',n(a.desp)));if(a.desp<=0)L.push(ctr('*** CUENTA SALDADA ***'));L.push('='.repeat(W));if(a.nota)L.push('Nota: '+a.nota);L.push(ctr('Gracias por su pago'));return L}
const showTk=(t,L)=>openM(`<h2>${esc(t)}</h2><pre>${esc(L.join('\n'))}</pre><div class="row noprint"><button class="b1" onclick="window.print()">🖨️ IMPRIMIR</button><button onclick="closeM()">CERRAR</button></div>`);
// ---------- vistas ----------
const R={};
R.dash=()=>{const vh=S.ventas.filter(v=>v.fecha==hoy()).reduce((a,v)=>a+v.total,0),al=S.productos.filter(p=>p.cant<=p.min).length,dt=S.clientes.reduce((a,c)=>a+deuda(c.id),0),ve=S.clientes.filter(c=>deuda(c.id)>0&&atraso(c.id)>0).length;
 const cd=(t,v,c,k)=>`<div class="card ${k?'clk':''}" ${k?`onclick="go('${k}')"`:''}><span style="color:var(--mut)">${t}</span><div class="v" style="color:${c}">${v}</div></div>`;
 main(head('Panel Principal','Resumen general del negocio')+`<div class="grid g6" style="margin-bottom:28px">${cd('Ventas del Día',M(vh),'var(--pri)')}${cd('Alertas de Stock',al,al?'#E11D2E':'var(--ink)','stk')}${cd('Productos en Catálogo',S.productos.length,'var(--ink)')}${cd('Servicios Activos',S.servicios.length,'var(--ink)')}${cd('Cuentas por Cobrar',M(dt),dt>0?'#E11D2E':'var(--ink)')}${cd('Créditos Vencidos',ve,ve?'#E11D2E':'var(--ink)')}</div><h2>Accesos Directos</h2><div class="grid g6">${[['🛒','Nueva Venta','vta'],['📦','Ver Productos','prod'],['🛠️','Servicios','serv'],['👨‍🔧','Gomeros','gom'],['💳','Créditos','cred']].map(a=>`<div class="card clk" style="text-align:center;font-weight:700" onclick="go('${a[2]}')">${a[0]}<br>${a[1]}</div>`).join('')}</div>`)};
// Punto de venta
const words=(s,n)=>q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>n.toLowerCase().includes(w));
R.vta=()=>{main(head('Punto de Venta','Selecciona productos o servicios para armar la venta · doble clic para agregar')+`<div class="split"><div><input placeholder="🔍 Buscar producto o servicio..." value="${esc(q)}" oninput="q=this.value;vl()" style="margin-bottom:10px"><div class="tabs"><button class="${tab=='P'?'on':''}" onclick="tab='P';R.vta()">📦 PRODUCTOS</button> <button class="${tab=='S'?'on':''}" onclick="tab='S';R.vta()">🛠️ SERVICIOS</button></div><div class="tw" id="vl"></div></div>
<div class="card side" style="width:390px"><h2>Resumen de Venta</h2><label>Gomero:</label><select id="gm">${S.gomeros.map(g=>`<option>${esc(g)}</option>`).join('')}</select><small style="color:var(--mut)">${S.gomeros.length?'(se aplica a los servicios de esta venta)':'⚠ No hay gomeros registrados.'}</small>
<label style="margin-top:12px"><input type="checkbox" id="cr" style="width:auto" onchange="tcr()"> Venta a Crédito (Fiar)</label><div id="crb" style="display:none"><select id="cl"><option value="">— Cliente —</option>${S.clientes.map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join('')}</select></div>
<label>Cantidad:</label><input id="qt" type="number" min="1" value="1" style="width:90px"><div id="ct"></div>
<div class="tot"><small style="color:var(--mut)">TOTAL</small><span id="tt">$0.00</span></div><label><input type="checkbox" style="width:auto" ${S.cfg.imp?'checked':''} onchange="S.cfg.imp=this.checked?1:0;save()"> 🖨️ Imprimir factura al finalizar</label>
<button class="b1 w" onclick="addSel()">AGREGAR AL CARRITO</button><div class="row"><button class="w" onclick="editCart()">EDITAR CANTIDAD</button><button class="bl w" onclick="cart=cart.filter(x=>x.n!=selT.c);cartUI()">ELIMINAR ÍTEM</button></div>
${ES(ses.rol)?'<button class="w" onclick="devol()">↩️ DEVOLUCIÓN</button>':''}<button class="b2 w" style="margin-top:10px" onclick="finalizar()">FINALIZAR VENTA</button><button class="w" onclick="cart=[];cartUI()">VACIAR TODO</button></div></div>`);vl();cartUI()};
function vl(){const P=tab=='P',L=(P?S.productos:S.servicios).filter(x=>words(q,x.nombre)).sort((a,b)=>a.nombre.localeCompare(b.nombre));
 $('#vl').innerHTML=`<table><tr><th class="l">${P?'Producto':'Servicio'}</th>${P?'<th>Stock</th><th>P. Compra</th>':''}<th>${P?'P. Venta':'Precio'}</th></tr>${L.map(x=>`<tr class="r ${P?tcls(x):''} ${selT.v==x.id?'sel':''}" onclick="selT.v=${x.id};vl()" ondblclick="selT.v=${x.id};addSel()"><td class="l">${esc(x.nombre)}</td>${P?`<td>${x.cant}</td><td>${M(x.pc)}</td>`:''}<td>${M(P?x.pv:x.precio)}</td></tr>`).join('')}</table>`}
const tcr=()=>{if($('#cr').checked&&!S.clientes.length){alert("No hay clientes a crédito registrados. Agréguelos primero en 'Créditos'.");$('#cr').checked=false}$('#crb').style.display=$('#cr').checked?'block':'none'};
function addSel(){const P=tab=='P',x=(P?S.productos:S.servicios).find(x=>x.id==selT.v);if(!x)return;const c=+$('#qt').value;if(c<=0)return;const it=cart.find(y=>y.n==x.nombre),tot=c+(it?it.c:0);
 if(P&&tot>x.cant)return alert(`Solo hay ${x.cant} disponibles.`);if(it)it.c=tot;else cart.push({n:x.nombre,c,p:P?x.pv:x.precio,prod:P});cartUI()}
function cartUI(){$('#ct').innerHTML=`<table style="margin:8px 0"><tr><th class="l">Item</th><th>Cant</th><th>Sub</th></tr>${cart.map(x=>`<tr class="r ${selT.c==x.n?'sel':''}" onclick="selT.c='${esc(x.n).replace(/'/g,"\\'")}';cartUI()"><td class="l">${esc(x.n)}</td><td>${x.c}</td><td>${M(x.c*x.p)}</td></tr>`).join('')}</table>`;$('#tt').textContent=M(cart.reduce((a,x)=>a+x.c*x.p,0))}
function editCart(){const x=cart.find(y=>y.n==selT.c);if(!x)return alert('Seleccione un ítem del carrito para editar.');const p=S.productos.find(y=>y.nombre==x.n),n=parseInt(prompt(`Nueva cantidad para '${x.n}':`,x.c));if(n>0){if(p&&n>p.cant)return alert('Stock insuficiente.');x.c=n;cartUI()}}
function finalizar(){if(!cart.length)return;const cr=$('#cr').checked,cid=+$('#cl').value,g=$('#gm').value,tot=cart.reduce((a,x)=>a+x.c*x.p,0),cl=S.clientes.find(c=>c.id==cid);
 if(cr){if(!cl)return alert('Seleccione el cliente al que se le fiará esta venta.');const d=deuda(cid);if(cl.lim>0&&d+tot>cl.lim&&!confirm(`${cl.nombre} debe ${M(d)} y su límite es ${M(cl.lim)}.\nCon esta venta quedaría debiendo ${M(d+tot)}.\n\n¿Registrar la venta de todas formas?`))return}
 const hs=cart.some(x=>!x.prod);if(hs&&!g)return alert('Hay un servicio en la venta. Selecciona el gomero que lo hizo (agrégalo en «Gomeros»).');
 const id=nid(),f={id,cod:'F-'+String(id).padStart(6,'0'),tipo:cr?'CREDITO':'CONTADO',fecha:hoy(),hora:hora(),cid:cr?cid:null,cnom:cr?cl.nombre:null,gomero:hs?g:'-',total:tot,cajero:ses.u};S.facturas.push(f);
 cart.forEach(x=>{if(x.prod)S.productos.find(p=>p.nombre==x.n).cant-=x.c;const gm=x.prod?'-':g;
  if(cr)S.cargos.push({id:nid(),cid,desc:x.n,cant:x.c,pu:x.p,total:x.c*x.p,fecha:hoy(),gomero:gm,fid:id});else S.ventas.push({id:nid(),nombre:x.n,cant:x.c,total:x.c*x.p,fecha:hoy(),gomero:gm,fid:id})});
 save();cart=[];alert(`${cr?'Venta fiada registrada en la cuenta de '+cl.nombre:'Venta finalizada'}.\nFactura: ${f.cod}`);if(S.cfg.imp)showTk('Factura '+f.cod,tkFactura(f));rr()}
function devol(){if(tab=='S')return alert('Los servicios no admiten devoluciones.');const p=S.productos.find(x=>x.id==selT.v);if(!p)return alert('Seleccione un producto de la tabla para devolver.');
 const vend=S.ventas.filter(v=>v.nombre==p.nombre).reduce((a,v)=>a+v.cant,0);if(vend<=0)return alert(`No hay registros de venta para '${p.nombre}'.`);
 let n=parseInt(prompt(`¿Cuántas unidades de '${p.nombre}' desea devolver?\n(Vendidas históricamente: ${vend})`,1));if(!(n>0&&n<=vend))return;p.cant+=n;
 for(const v of S.ventas.filter(v=>v.nombre==p.nombre).reverse()){if(n<=0)break;if(v.cant<=n){n-=v.cant;S.ventas=S.ventas.filter(x=>x!==v)}else{v.cant-=n;v.total-=n*p.pv;n=0}}save();alert('Devolución procesada. Stock e historial actualizados.');rr()}
// CRUD genérico (productos, servicios, gomeros)
function crud(t,titulo,sub,cols,fields,extra){const A=t=='prod'?S.productos:t=='serv'?S.servicios:null;

 const a=m.a?[m[2],m[1],m[3]]:[m[1],m[2],m[3]],c=Math.round(num(a[0])),p=num(a[2],1);const n=a[1].replace(/^[\s\-|;]+|[\s\-|;]+$/g,'');return n&&c>0&&p>0?{n,c,pc:p,pv:0}:null}

R.ent=()=>main(head('Entrada de Mercancía','Pega el texto de la factura, revisa los productos y actualiza el inventario')+`<div class="card" style="margin-bottom:18px"><h2>Cargar productos desde texto</h2><textarea id="tx" rows="6" placeholder="Proveedor: Ejemplo SRL&#10;8 GOMAS USADAS 225-70-16 2,400.00&#10;12 ACEITE 20W-50 300.00"></textarea><div style="margin-top:8px"><button class="b2" onclick="pegar()">📋 PROCESAR TEXTO</button> <button onclick="rev=[];revisar('','')">➕ AGREGAR MANUALMENTE</button></div></div><h2>Historial de Entradas</h2><div class="tw"><table><tr><th>Fecha</th><th class="l">Proveedor</th><th>N° Factura</th><th>Total</th></tr>${S.entradas.slice().reverse().map(e=>`<tr class="r" onclick="verEnt(${e.id})"><td>${e.fecha}</td><td class="l">${esc(e.prov)}</td><td>${esc(e.num)}</td><td>${M(e.total)}</td></tr>`).join('')}</table></div>`);
function pegar(){const t=$('#tx').value;let pr='',nf='',mp={};t.split('\n').forEach(l=>{let a=l.trim().match(/^proveedor\s*[:#-]\s*(.+)$/i),b=l.trim().match(/^(?:n[uú]mero|n[º°o]?|factura)\s*(?:de\s*)?factura\s*[:#-]?\s*(.+)$/i);if(a)pr=a[1];else if(b)nf=b[1];else{const p=parseLn(l);if(p){const k=p.n.toLowerCase();if(mp[k]){mp[k].c+=p.c}else mp[k]=p}}});

// Reporte gomeros
R.rep=()=>{const d=selT.rd||hoy(),s=selT.rs||hoy(),ref=new Date(s+'T00:00'),lun=new Date(ref-((ref.getDay()+6)%7)*864e5),dias=[...Array(7)].map((_,i)=>new Date(+lun+i*864e5+36e5).toISOString().slice(0,10)),sv=(g,f)=>S.ventas.filter(v=>v.fecha==f&&v.gomero==g&&g!='-').reduce((a,v)=>a+v.total,0);
 main(head('Reporte Detallado por Gomero','Detalle diario y resumen semanal de comisiones')+`<div class="card" style="margin-bottom:16px"><h2>Detalle Diario</h2><input type="date" value="${d}" style="width:170px;margin-bottom:10px" onchange="selT.rd=this.value;rr()">${S.gomeros.map(g=>({g,l:S.ventas.filter(v=>v.fecha==d&&v.gomero==g)})).filter(x=>x.l.length).map(x=>`<div class="card row" style="margin:6px 0;align-items:center"><b style="font:700 14px Consolas;flex:3">${esc(x.g)}: ${x.l.map(v=>Math.round(v.total).toLocaleString('en')).join(' ')}</b><b style="color:var(--pri);text-align:right">${M(x.l.reduce((a,v)=>a+v.total,0))}</b></div>`).join('')||'<p style="color:var(--mut)">Sin servicios ese día.</p>'}</div>
 <div class="card"><h2>Resumen Semanal</h2><input type="date" value="${s}" style="width:170px;margin-bottom:10px" onchange="selT.rs=this.value;rr()"><div class="tw"><table><tr><th class="l">Gomero</th>${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x=>`<th>${x}</th>`).join('')}<th>Total</th></tr>${S.gomeros.map(g=>{const v=dias.map(f=>sv(g,f)),t=v.reduce((a,b)=>a+b,0);return t?`<tr><td class="l">${esc(g)}</td>${v.map(x=>`<td>${x?M(x):'-'}</td>`).join('')}<td><b>${M(t)}</b></td></tr>`:''}).join('')}</table></div></div>`)};
// Usuarios
R.usr=()=>main(head('Usuarios y Perfiles','Administrador: puede hacer todo · Cajero: solo ventas, cobros y consultas')+`<div class="card row" style="align-items:end;margin-bottom:12px"><div><label>Usuario</label><input id="uu"></div><div><label>Contraseña</label><input id="u1" type="password"></div><div><label>Repetir</label><input id="u2" type="password"></div><div><label>Perfil</label><select id="ur"><option value="cajero">Cajero</option><option value="admin">Administrador</option></select></div><button class="b1" style="flex:0 0 130px" onclick="uNew()">➕ CREAR</button></div><p id="um" class="ok"></p>
 <div class="tw"><table><tr><th class="l">Usuario</th><th>Perfil</th><th>Estado</th></tr>${S.usuarios.map(u=>`<tr class="r ${selT.u==u.id?'sel':''}" style="${u.act?'':'color:var(--mut)'}" onclick="sel('u',${u.id})"><td class="l">${esc(u.u)}${u.id==ses.id?' (tú)':''}</td><td>${u.rol=='admin'?'Administrador':'Cajero'}</td><td>${u.act?'Activo':'Desactivado'}</td></tr>`).join('')}</table></div><div class="row" style="margin-top:12px;max-width:420px"><button onclick="uPass()">🔑 CAMBIAR CONTRASEÑA</button><button onclick="uTog()">⏸ ACTIVAR / DESACTIVAR</button></div>`);
const um=(ok,t)=>{$('#um').className=ok?'ok':'err';$('#um').textContent=t};
function uNew(){const u=$('#uu').value.trim(),p=$('#u1').value;if(u.length<3)return um(0,'El usuario debe tener al menos 3 caracteres.');if(p.length<4)return um(0,'La contraseña debe tener al menos 4 caracteres.');if(p!=$('#u2').value)return um(0,'Las contraseñas no coinciden.');if(S.usuarios.some(x=>x.u.toLowerCase()==u.toLowerCase()))return um(0,`Ya existe «${u}».`);S.usuarios.push({id:nid(),u,p,rol:$('#ur').value,act:1});save();R.usr();um(1,`Usuario «${u}» creado.`)}
function uPass(){const u=S.usuarios.find(x=>x.id==selT.u);if(!u)return um(0,'Selecciona un usuario.');const a=prompt('Nueva contraseña:');if(a===null)return;if(a.length<4)return um(0,'Mínimo 4 caracteres.');if(a!=prompt('Repite la nueva contraseña:'))return um(0,'No coinciden.');u.p=a;save();um(1,'Contraseña cambiada.')}
function uTog(){const u=S.usuarios.find(x=>x.id==selT.u);if(!u)return um(0,'Selecciona un usuario.');if(u.id==ses.id)return um(0,'No puedes desactivar tu propio usuario.');if(u.act&&u.rol=='admin'&&S.usuarios.filter(x=>x.rol=='admin'&&x.act).length<=1)return um(0,'Debe quedar al menos un administrador activo.');u.act=u.act?0:1;save();R.usr();um(1,`«${u.u}» ahora está ${u.act?'ACTIVO':'DESACTIVADO'}.`)}
</script></body></html>
